# Docker Compose services for local development infrastructure
# Services:
#   - litellm: Proxy routing requests to local Ollama runtime
#   - db: PostgreSQL storage for Langfuse
#   - langfuse-server: Langfuse v2 observability service

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-local-dev}"

  db:
    image: postgres:16-alpine
    container_name: langfuse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-server:
    image: langfuse/langfuse:2.93.3
    container_name: langfuse_server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-langfuse_secret}@db:5432/${POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-7d0d5d8e6d8fded60f131058fb7259efb9919d72edadfcee3505560ae3c103fc}"
      SALT: "${SALT:-292f7bf54f5ed07907ec01bf2614076ef7ac91565f3f1908ba123e681e9cd376}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-562409a05d7ab250a679ffd4bd904a614ba61a44423926d327f95192a1bba9ea}"
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_postgres_data:

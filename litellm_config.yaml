# LiteLLM Model Proxy Configuration
# Maps logical model aliases to upstream local Ollama backends.

model_list:
  # Small model target: low-latency reasoning and fallback target
  - model_name: small-model
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://host.docker.internal:11434
      request_timeout: 30

  # Large model target: high-capacity reasoning for complex queries
  - model_name: large-model
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://host.docker.internal:11434
      request_timeout: 60

general_settings:
  master_key: "sk-local-dev"
  set_verbose: true
